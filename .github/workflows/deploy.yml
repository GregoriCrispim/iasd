name: Deploy Automático para Hostgator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, zip
          coverage: none

      # Valida o composer.lock e regenera o discovery sem Spatie/Filament.
      # Na HostGator (shared) não roda composer; o vendor base já está no servidor.
      # Pacotes novos (ex.: DomPDF) + autoload do Composer sobem como delta via FTP.
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Refresh package discovery cache
        run: |
          php artisan package:discover --ansi
          test -f bootstrap/cache/packages.php
          if grep -qiE 'spatie|filament' bootstrap/cache/packages.php; then
            echo "FAIL: packages.php ainda referencia Spatie/Filament"
            exit 1
          fi
          if grep -q 'Barryvdh\\\\DomPDF\\\\ServiceProvider' bootstrap/cache/packages.php; then
            test -d vendor/barryvdh/laravel-dompdf
            echo "DomPDF discovered and present in vendor."
          fi
          echo "Package discovery OK (sem Spatie/Filament)."

      # FTP-Deploy-Action não suporta exclusão com negação (!vendor/foo).
      # Por isso removemos o vendor completo e deixamos só o delta que a HostGator
      # ainda não tem (ou cujo autoload precisa ser atualizado).
      - name: Prune vendor to HostGator delta
        run: |
          set -euo pipefail
          # Top-level entries that must be synced when composer.lock adds packages
          # that the shared host cannot install itself.
          keep='autoload.php|composer|barryvdh|dompdf|sabberworm'
          for entry in vendor/* vendor/.[!.]*; do
            [ -e "$entry" ] || continue
            name=$(basename "$entry")
            if ! printf '%s\n' "$name" | grep -Eq "^($keep)$"; then
              rm -rf "$entry"
            fi
          done
          test -f vendor/autoload.php
          test -d vendor/composer
          test -d vendor/barryvdh/laravel-dompdf
          test -d vendor/dompdf/dompdf
          test -d vendor/sabberworm/php-css-parser
          echo "Vendor delta for FTP:"
          du -sh vendor vendor/* | sort -h

      - name: Verify deploy payload
        run: |
          test -f artisan
          test -d public
          test -f public/js/vendor/human-3.3.6.js
          test -f public/models/human/3.3.6/faceres.bin
          test -f public/models/human/3.3.6/models.json
          test ! -d vendor/filament
          test ! -d vendor/spatie/laravel-permission
          test -d vendor/barryvdh/laravel-dompdf
          test -f bootstrap/cache/packages.php
          grep -q 'Barryvdh\\\\DomPDF\\\\ServiceProvider' bootstrap/cache/packages.php
          echo "Deploy payload ready."

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .env
            .env.*
            tests/**
            phpunit.xml
            .composer-cache/**
            .composer-home/**
            deploy/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
